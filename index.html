
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Turbo Racing Premium</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:radial-gradient(ellipse at top,#173958,#07111f 65%);
 color:white;font-family:Arial,sans-serif;text-align:center;
 user-select:none;-webkit-user-select:none
}
header{padding:16px 8px 8px}
h1{margin:0;color:#62f1ff;font-size:26px;letter-spacing:3px;text-shadow:0 0 15px #00cfff}
header p{font-size:11px;color:#9dbbd5;letter-spacing:2px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px;max-width:420px;margin:auto}
.stat{background:linear-gradient(145deg,#173550,#0b192b);border:1px solid #315674;border-radius:12px;padding:9px 3px;font-size:10px;letter-spacing:1px}
.stat strong{display:block;font-size:17px;color:#62f1ff;margin-top:5px}
.game{position:relative;width:min(100%,420px);margin:auto;padding:0 5px}
canvas{display:block;width:100%;height:auto;border:2px solid #426b8a;border-radius:15px;box-shadow:0 0 25px #00cfff22;touch-action:none}
.overlay{position:absolute;inset:0 5px;display:flex;align-items:center;justify-content:center;background:#06111ddc;backdrop-filter:blur(4px);border-radius:15px;padding:18px}
.panel{width:100%;padding:23px 12px;background:linear-gradient(145deg,#173654,#081728);border:1px solid #62edff;border-radius:20px;box-shadow:0 0 30px #00bce533}
.panel h2{color:#70f1ff;margin:0 0 10px}
.panel p{font-size:14px;line-height:1.6;color:#d0deed}
button{border:1px solid #ffffff30;border-radius:14px;padding:13px 14px;background:linear-gradient(#65f2ff,#12b9e5);color:#041522;font-size:15px;font-weight:bold;box-shadow:0 4px 0 #087c9a;touch-action:none}
button:active{transform:translateY(2px)}
.controls{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 6px 8px;max-width:420px;margin:auto}
.controls button{min-width:59px;min-height:54px;font-size:22px}
#nitro{min-width:83px;background:linear-gradient(#ffe18a,#ff9d1e);color:#492400;box-shadow:0 4px 0 #ad5b0a;font-size:13px}
#pause{background:linear-gradient(#d6e3f5,#8ba8ca);color:#10253c;min-width:55px}
#left,#right{background:linear-gradient(#dcecff,#8caed2);color:#10253c;box-shadow:0 4px 0 #476887}
.help{font-size:11px;color:#a6bbd1;padding:5px 10px 16px}
.hidden{display:none!important}
@media(max-width:360px){h1{font-size:22px}.controls{gap:6px}.controls button{min-width:52px;padding:9px}#nitro{min-width:72px}}
</style>
</head>
<body>
<header>
<h1>🏎 TURBO RACING</h1>
<p>PREMIUM ARCADE EDITION</p>
</header>

<div class="hud">
 <div class="stat">SCORE<strong id="score">0</strong></div>
 <div class="stat">BEST<strong id="best">0</strong></div>
 <div class="stat">LIVES<strong id="lives">❤️❤️❤️</strong></div>
 <div class="stat">SPEED<strong id="speed">0</strong></div>
 <div class="stat">LEVEL<strong id="level">1</strong></div>
 <div class="stat">NITRO<strong id="fuel">100%</strong></div>
</div>

<div class="game">
 <canvas id="game" width="360" height="540"></canvas>
 <div class="overlay" id="overlay">
  <div class="panel">
   <h2 id="title">TURBO RACING</h2>
   <p id="message">Avoid traffic, collect points and use Nitro to race faster!</p>
   <button id="start">START RACE 🏁</button>
  </div>
 </div>
</div>

<div class="controls">
 <button id="left">⬅️</button>
 <button id="nitro">⚡ NITRO</button>
 <button id="right">➡️</button>
 <button id="pause">Ⅱ</button>
</div>
<div class="help">Hold arrows to steer • Hold Nitro to boost • Avoid traffic</div>

<script>
"use strict";
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const W=360,H=540,L=38,R=322;
const laneW=(R-L)/3;

let player,enemies=[],score=0,lives=3,fuel=100,level=1,best=0;
let roadOffset=0,sceneOffset=0,spawnTimer=0;
let running=false,paused=false;
let lastTime=0,raf=0;
const keys={left:false,right:false,nitro:false};

try{best=Number(localStorage.getItem("turboBest"))||0}catch(e){}
$("best").textContent=best;

function roundRect(x,y,w,h,r,color){
 ctx.fillStyle=color;
 r=Math.min(r,w/2,h/2);
 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.lineTo(x+w-r,y);
 ctx.quadraticCurveTo(x+w,y,x+w,y+r);
 ctx.lineTo(x+w,y+h-r);
 ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
 ctx.lineTo(x+r,y+h);
 ctx.quadraticCurveTo(x,y+h,x,y+h-r);
 ctx.lineTo(x,y+r);
 ctx.quadraticCurveTo(x,y,x+r,y);
 ctx.closePath();ctx.fill();
}

function newGame(){
 player={x:W/2-17,y:H-100,w:34,h:59};
 enemies=[];score=0;lives=3;fuel=100;level=1;
 roadOffset=0;sceneOffset=0;spawnTimer=0;
 updateHUD();
}

function updateHUD(){
 $("score").textContent=score;
 $("best").textContent=best;
 $("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);
 $("level").textContent=level;
 $("fuel").textContent=Math.floor(fuel)+"%";
 $("speed").textContent=Math.round(180+level*15+(keys.nitro&&fuel>0?100:0));
}

function drawRoad(){
 // Grass
 const grass=ctx.createLinearGradient(0,0,W,0);
 grass.addColorStop(0,"#15532d");
 grass.addColorStop(.5,"#34864a");
 grass.addColorStop(1,"#15532d");
 ctx.fillStyle=grass;ctx.fillRect(0,0,W,H);

 // Grass texture
 for(let y=-30+sceneOffset%70;y<H;y+=70){
  ctx.fillStyle="#55a85c";
  ctx.fillRect(7,y,13,24);
  ctx.fillRect(340,y+30,12,23);
 }

 // Road shoulder
 ctx.fillStyle="#a2a5a8";
 ctx.fillRect(L-8,0,R-L+16,H);

 // Asphalt gradient
 const asphalt=ctx.createLinearGradient(L,0,R,0);
 asphalt.addColorStop(0,"#262b32");
 asphalt.addColorStop(.5,"#424852");
 asphalt.addColorStop(1,"#262b32");
 ctx.fillStyle=asphalt;ctx.fillRect(L,0,R-L,H);

 // Road texture
 ctx.fillStyle="#ffffff09";
 for(let y=-90+sceneOffset%90;y<H;y+=90){
  ctx.fillRect(L+22,y,2,34);
  ctx.fillRect(R-26,y+30,2,30);
 }

 // Road edge lines
 ctx.fillStyle="#fff";
 ctx.fillRect(L,0,3,H);
 ctx.fillRect(R-3,0,3,H);

 // Red-white kerbs
 for(let y=-36+roadOffset%36;y<H;y+=36){
  ctx.fillStyle=(Math.floor((y+36)/36)%2===0)?"#ef3848":"#fff";
  ctx.fillRect(L-8,y,5,18);
  ctx.fillRect(R+3,y,5,18);
 }

 // Lane markings
 ctx.fillStyle="#f7f4df";
 for(let lane=1;lane<3;lane++){
  const x=L+lane*laneW-2;
  for(let y=-48+roadOffset%65;y<H;y+=65){
   ctx.fillRect(x,y,4,34);
  }
 }

 // Roadside trees
 for(let y=-30+sceneOffset%110;y<H;y+=110){
  for(const t of [{x:17,y:y+10},{x:343,y:y+65}]){
   ctx.fillStyle="#0005";
   ctx.beginPath();
   ctx.ellipse(t.x+3,t.y+8,12,7,0,0,Math.PI*2);
   ctx.fill();
   ctx.fillStyle="#104b29";
   ctx.beginPath();ctx.arc(t.x,t.y,10,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#2da65b";
   ctx.beginPath();ctx.arc(t.x-3,t.y-4,6,0,Math.PI*2);ctx.fill();
  }
 }
}

function drawCar(c,isPlayer=false){
 const {x,y,w,h}=c;
 const color=isPlayer?"#08d5ff":c.color;

 // Shadow
 ctx.fillStyle="#0006";
 ctx.beginPath();
 ctx.ellipse(x+w/2,y+h/2+5,w*.7,h*.52,0,0,Math.PI*2);
 ctx.fill();

 // Nitro flames
 if(isPlayer&&keys.nitro&&fuel>0){
  const flame=14+Math.random()*12;
  ctx.fillStyle="#22eaff";
  ctx.beginPath();
  ctx.moveTo(x+7,y+h-2);ctx.lineTo(x+12,y+h+flame);
  ctx.lineTo(x+17,y+h-2);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+w-17,y+h-2);ctx.lineTo(x+w-12,y+h+flame);
  ctx.lineTo(x+w-7,y+h-2);ctx.fill();
 }

 // Wheels
 roundRect(x-4,y+10,7,15,3,"#11151c");
 roundRect(x+w-3,y+10,7,15,3,"#11151c");
 roundRect(x-4,y+h-25,7,15,3,"#11151c");
 roundRect(x+w-3,y+h-25,7,15,3,"#11151c");

 // Body
 roundRect(x,y,w,h,8,color);
 roundRect(x+4,y+5,w-8,10,4,isPlayer?"#8bf4ff":"#ffffff66");

 // Glass and cabin
 roundRect(x+5,y+17,w-10,13,4,"#183b53");
 ctx.fillStyle="#b8f1ff";
 ctx.fillRect(x+7,y+19,5,2);
 roundRect(x+6,y+34,w-12,10,3,"#15364b");

 // Rear deck
 roundRect(x+6,y+h-19,w-12,8,3,isPlayer?"#00a3d4":"#343b46");

 // Lights
 ctx.fillStyle="#fff5ad";
 ctx.fillRect(x+3,y+2,7,4);
 ctx.fillRect(x+w-10,y+2,7,4);
 ctx.fillStyle="#ff304e";
 ctx.fillRect(x+3,y+h-5,7,3);
 ctx.fillRect(x+w-10,y+h-5,7,3);
}

function spawnEnemy(){
 const lane=Math.floor(Math.random()*3);
 const colors=["#ff414f","#ffb82e","#b779ff","#f2f5ff"];
 enemies.push({
  x:L+lane*laneW+(laneW-34)/2,
  y:-75,w:34,h:59,
  color:colors[Math.floor(Math.random()*colors.length)]
 });
}

function collision(a,b){
 return a.x+5<b.x+b.w-5&&
        a.x+a.w-5>b.x+5&&
        a.y+8<b.y+b.h-8&&
        a.y+a.h-8>b.y+8;
}

function saveBest(){
 if(score>best){
  best=score;
  try{localStorage.setItem("turboBest",String(best))}catch(e){}
 }
}

function showOverlay(title,message,button){
 $("title").textContent=title;
 $("message").textContent=message;
 $("start").textContent=button;
 $("overlay").classList.remove("hidden");
}

function startGame(){
 cancelAnimationFrame(raf);
 newGame();
 running=true;paused=false;
 keys.left=keys.right=keys.nitro=false;
 $("overlay").classList.add("hidden");
 lastTime=performance.now();
 raf=requestAnimationFrame(loop);
}

function finishGame(){
 running=false;paused=false;
 keys.nitro=false;
 saveBest();updateHUD();draw();
 showOverlay("🏁 GAME OVER","Score: "+score+" • Best: "+best,"RACE AGAIN 🔄");
}

function togglePause(){
 if(running){
  running=false;paused=true;
  keys.left=keys.right=keys.nitro=false;
  showOverlay("RACE PAUSED","Your race is paused. Continue when ready.","RESUME ▶");
 }else if(paused){
  paused=false;running=true;
  $("overlay").classList.add("hidden");
  lastTime=performance.now();
  raf=requestAnimationFrame(loop);
 }
}

function update(dt){
 level=1+Math.floor(score/100);
 const boost=keys.nitro&&fuel>0;
 const speed=230+level*15+(boost?135:0);

 if(boost)fuel=Math.max(0,fuel-32*dt);
 else fuel=Math.min(100,fuel+8*dt);

 if(keys.left)player.x-=250*dt;
 if(keys.right)player.x+=250*dt;
 player.x=Math.max(L+7,Math.min(R-player.w-7,player.x));

 roadOffset=(roadOffset+speed*dt)%130;
 sceneOffset=(sceneOffset+speed*.4*dt)%110;

 spawnTimer+=dt;
 if(spawnTimer>Math.max(.43,1-level*.065)){
  spawnEnemy();spawnTimer=0;
 }

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];
  e.y+=speed*dt;

  if(collision(player,e)){
   enemies.splice(i,1);
   lives--;
   if(lives<=0){finishGame();return}
   continue;
  }

  if(e.y>H){
   enemies.splice(i,1);
   score+=10;
  }
 }
 updateHUD();
}

function draw(){
 drawRoad();
 enemies.forEach(e=>drawCar(e));
 if(player)drawCar(player,true);
}

function loop(time){
 if(!running||paused)return;
 const dt=Math.min((time-lastTime)/1000||0,.035);
 lastTime=time;
 update(dt);
 if(!running){draw();return}
 draw();
 raf=requestAnimationFrame(loop);
}

$("start").addEventListener("click",()=>{
 if(paused){
  paused=false;running=true;
  $("overlay").classList.add("hidden");
  lastTime=performance.now();
  raf=requestAnimationFrame(loop);
 }else startGame();
});

$("pause").addEventListener("click",togglePause);

function bindControl(id,key){
 const b=$(id);
 b.style.touchAction="none";

 const press=e=>{
  e.preventDefault();
  keys[key]=true;
 };
 const release=e=>{
  if(e)e.preventDefault();
  keys[key]=false;
 };

 if("PointerEvent" in window){
  b.addEventListener("pointerdown",press,{passive:false});
  b.addEventListener("pointerup",release,{passive:false});
  b.addEventListener("pointercancel",release,{passive:false});
  b.addEventListener("lostpointercapture",release);
 }else{
  b.addEventListener("touchstart",press,{passive:false});
  b.addEventListener("touchend",release,{passive:false});
  b.addEventListener("touchcancel",release,{passive:false});
  b.addEventListener("mousedown",press);
  b.addEventListener("mouseup",release);
  b.addEventListener("mouseleave",release);
 }
}

bindControl("left","left");
bindControl("right","right");
bindControl("nitro","nitro");

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a"){
  keys.left=true;e.preventDefault();
 }
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d"){
  keys.right=true;e.preventDefault();
 }
 if(e.key===" "){e.preventDefault();togglePause()}
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false;
});

window.addEventListener("blur",()=>{
 keys.left=keys.right=keys.nitro=false;
});

newGame();
draw();
</script>
</body>
</html>
