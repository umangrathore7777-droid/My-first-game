<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>Turbo Racing 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif;text-align:center;user-select:none;-webkit-user-select:none}
header{padding:12px 8px 5px}
h1{margin:0;color:#48eaff;font-size:25px;letter-spacing:2px}
header p{margin:5px;color:#9eb9d4;font-size:12px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px;max-width:440px;margin:auto}
.stat{background:#13253a;border:1px solid #274662;border-radius:10px;padding:8px 2px;font-size:12px}
.stat strong{display:block;font-size:17px;color:#51edff;margin-top:4px}
.game{position:relative;width:min(100%,420px);margin:auto;padding:0 5px}
canvas{width:100%;height:auto;display:block;border:2px solid #385875;border-radius:12px;background:#333;touch-action:none}
.overlay{position:absolute;inset:0 5px 0;display:flex;align-items:center;justify-content:center;background:#06111dcc;border-radius:12px;padding:18px}
.panel{width:100%;padding:22px 12px;background:#10243af2;border:1px solid #3eeaff;border-radius:18px;box-shadow:0 0 28px #00bce533}
.panel h2{color:#51eaff;margin:0 0 10px}
.panel p{font-size:14px;line-height:1.5;color:#d0deed}
button{border:0;border-radius:12px;padding:13px 17px;background:#43e8ff;color:#061322;font-size:15px;font-weight:bold;touch-action:manipulation}
button:active{transform:scale(.96)}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 8px 6px}
.controls button{min-width:67px;min-height:53px;font-size:22px}
#nitro{background:#ffb82e;min-width:86px;font-size:13px}
#pause{background:#b6c8e1;min-width:60px;font-size:14px}
.help{font-size:12px;color:#a6bbd1;padding:5px 10px 14px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🏎 TURBO RACING</h1>
  <p>ARCADE EDITION • DODGE • BOOST • SURVIVE</p>
</header>

<div class="hud">
  <div class="stat">SCORE<strong id="score">0</strong></div>
  <div class="stat">BEST<strong id="best">0</strong></div>
  <div class="stat">LIVES<strong id="lives">❤️❤️❤️</strong></div>
  <div class="stat">SPEED<strong id="speed">0</strong></div>
  <div class="stat">LEVEL<strong id="level">1</strong></div>
  <div class="stat">NITRO<strong id="fuel">100%</strong></div>
</div>

<div class="game">
  <canvas id="game" width="360" height="540" aria-label="Turbo Racing game"></canvas>
  <div class="overlay" id="overlay">
    <div class="panel">
      <h2 id="title">TURBO RACING 3.0</h2>
      <p id="message">Avoid traffic, collect points and use Nitro to race faster!</p>
      <button id="start">START RACE 🏁</button>
    </div>
  </div>
</div>

<div class="controls">
  <button id="left" aria-label="Steer left">⬅️</button>
  <button id="nitro">⚡ NITRO</button>
  <button id="right" aria-label="Steer right">➡️</button>
  <button id="pause">Ⅱ</button>
</div>
<div class="help">Hold arrows to steer • Hold NITRO to boost • Avoid traffic</div>

<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);
const W = canvas.width, H = canvas.height;
const L = 38, R = 322, laneW = (R - L) / 3;

// Optional image files: place player.png and enemy.png beside index.html.
const playerImg = new Image();
const enemyImg = new Image();
playerImg.src = "player.png";
enemyImg.src = "enemy.png";

let player, enemies, score, lives, fuel, level;
let roadOffset = 0, sceneOffset = 0, spawnTimer = 0;
let running = false, paused = false, gameOver = false;
let lastTime = 0, animationId = 0;
let keys = {left:false, right:false, nitro:false};
let best = 0;

try { best = Number(localStorage.getItem("turboRacingBest")) || 0; } catch(e) {}
$("best").textContent = best;

function resetGame() {
  player = {x: W/2 - 17, y: H - 95, w: 34, h: 57};
  enemies = [];
  score = 0; lives = 3; fuel = 100; level = 1;
  roadOffset = 0; sceneOffset = 0; spawnTimer = 0;
  updateHUD();
}

function updateHUD() {
  $("score").textContent = score;
  $("best").textContent = best;
  $("lives").textContent = "❤️".repeat(lives) + "🖤".repeat(3-lives);
  $("level").textContent = level;
  $("fuel").textContent = Math.floor(fuel) + "%";
  $("speed").textContent = Math.round(180 + level*15 + (keys.nitro && fuel>0 ? 100 : 0));
}

function roundedRect(x,y,w,h,r,color) {
  // Compatible rounded rectangle for older Android WebViews
  ctx.fillStyle = color;
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.fill();
}

function drawFallbackCar(c, isPlayer) {
  const x=c.x, y=c.y, w=c.w, h=c.h;
  ctx.fillStyle="#0005";
  ctx.beginPath();
  ctx.ellipse(x+w/2,y+h/2+4,w*.65,h*.5,0,0,Math.PI*2);
  ctx.fill();

  roundedRect(x-4,y+9,7,15,3,"#10151c");
  roundedRect(x+w-3,y+9,7,15,3,"#10151c");
  roundedRect(x-4,y+h-24,7,15,3,"#10151c");
  roundedRect(x+w-3,y+h-24,7,15,3,"#10151c");

  const bodyColor = isPlayer ? "#08cfff" : c.color;
  roundedRect(x,y,w,h,8,bodyColor);
  roundedRect(x+5,y+5,w-10,10,4,isPlayer?"#8df4ff":"#ffffff66");
  roundedRect(x+5,y+17,w-10,12,4,"#163b54");
  ctx.fillStyle="#a5efff";
  ctx.fillRect(x+7,y+19,5,2);
  roundedRect(x+6,y+h-20,w-12,9,3,"#18354b");

  ctx.fillStyle="#fff5ad";
  ctx.fillRect(x+3,y+2,7,4);
  ctx.fillRect(x+w-10,y+2,7,4);
  ctx.fillStyle="#ff304e";
  ctx.fillRect(x+3,y+h-5,7,3);
  ctx.fillRect(x+w-10,y+h-5,7,3);
}

function drawCar(c, isPlayer=false) {
  const img = isPlayer ? playerImg : enemyImg;
  const x=c.x, y=c.y, w=c.w, h=c.h;

  if (isPlayer && keys.nitro && fuel > 0) {
    ctx.fillStyle="#47eaff";
    ctx.beginPath();
    ctx.moveTo(x+7,y+h-1);
    ctx.lineTo(x+12,y+h+12+Math.random()*8);
    ctx.lineTo(x+17,y+h-1);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+w-17,y+h-1);
    ctx.lineTo(x+w-12,y+h+12+Math.random()*8);
    ctx.lineTo(x+w-7,y+h-1);
    ctx.fill();
  }

  ctx.fillStyle="#0005";
  ctx.beginPath();
  ctx.ellipse(x+w/2,y+h/2+4,w*.55,h*.47,0,0,Math.PI*2);
  ctx.fill();

  if (img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, x-5, y-3, w+10, h+6);
  } else {
    drawFallbackCar(c,isPlayer);
  }
}

function drawRoad(dt) {
  const grass = ctx.createLinearGradient(0,0,W,0);
  grass.addColorStop(0,"#155b30");
  grass.addColorStop(.5,"#38864b");
  grass.addColorStop(1,"#155b30");
  ctx.fillStyle=grass;
  ctx.fillRect(0,0,W,H);

  // Moving grass texture
  for(let y=-30+sceneOffset%70;y<H;y+=70){
    ctx.fillStyle="#4d9853";
    ctx.fillRect(8,y,12,25);
    ctx.fillRect(340,y+30,10,22);
  }

  // Shoulder and asphalt
  ctx.fillStyle="#777b80";
  ctx.fillRect(L-8,0,R-L+16,H);
  const asphalt=ctx.createLinearGradient(L,0,R,0);
  asphalt.addColorStop(0,"#292e35");
  asphalt.addColorStop(.5,"#41464d");
  asphalt.addColorStop(1,"#292e35");
  ctx.fillStyle=asphalt;
  ctx.fillRect(L,0,R-L,H);

  // Solid road edges
  ctx.fillStyle="#f4f4f4";
  ctx.fillRect(L,0,3,H);
  ctx.fillRect(R-3,0,3,H);

  // Red-white kerbs
  for(let y=-36+roadOffset%36;y<H;y+=36){
    const red=(Math.floor((y+36)/36)%2===0);
    ctx.fillStyle=red?"#f23b45":"#fff";
    ctx.fillRect(L-8,y,5,18);
    ctx.fillRect(R+3,y,5,18);
  }

  // Lane lines
  ctx.fillStyle="#f7f7e9";
  for(let lane=1;lane<3;lane++){
    const x=L+lane*laneW-2;
    for(let y=-48+roadOffset%65;y<H;y+=65){
      ctx.fillRect(x,y,4,34);
    }
  }

  // Trees beside the track
  for(let y=-35+sceneOffset%115;y<H;y+=115){
    for(const t of [{x:17,y:y+9},{x:343,y:y+60}]){
      ctx.fillStyle="#0004";
      ctx.beginPath();
      ctx.ellipse(t.x+2,t.y+6,11,7,0,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#104b29";
      ctx.beginPath();
      ctx.arc(t.x,t.y,10,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#2da65b";
      ctx.beginPath();
      ctx.arc(t.x-3,t.y-4,6,0,Math.PI*2);
      ctx.fill();
    }
  }

  roadOffset=(roadOffset+dt*230)%130;
  sceneOffset=(sceneOffset+dt*100)%115;
}

function spawnEnemy() {
  const lane=Math.floor(Math.random()*3);
  const colors=["#ff414f","#ffb82e","#b779ff","#eaf3ff"];
  enemies.push({
    x:L+lane*laneW+(laneW-34)/2,
    y:-70,w:34,h:57,
    color:colors[Math.floor(Math.random()*colors.length)]
  });
}

function collides(a,b) {
  return a.x+5 < b.x+b.w-5 &&
         a.x+a.w-5 > b.x+5 &&
         a.y+7 < b.y+b.h-7 &&
         a.y+a.h-7 > b.y+7;
}

function saveBest() {
  if(score>best){
    best=score;
    try{localStorage.setItem("turboRacingBest",String(best));}catch(e){}
  }
}

function showOverlay(title,message,buttonText) {
  $("title").textContent=title;
  $("message").textContent=message;
  $("start").textContent=buttonText;
  $("overlay").classList.remove("hidden");
}

function finishGame() {
  running=false; paused=false; gameOver=true;
  keys.nitro=false;
  saveBest();
  updateHUD();
  drawStatic();
  showOverlay("🏁 RACE OVER!","Score: "+score+" • Best: "+best+" • Try to beat your record!","RACE AGAIN 🔄");
}

function startGame() {
  cancelAnimationFrame(animationId);
  resetGame();
  running=true; paused=false; gameOver=false;
  keys={left:false,right:false,nitro:false};
  $("overlay").classList.add("hidden");
  lastTime=performance.now();
  animationId=requestAnimationFrame(loop);
}

function togglePause() {
  if(!running && !paused) return;
  if(running){
    running=false;paused=true;
    keys.left=keys.right=keys.nitro=false;
    showOverlay("RACE PAUSED","Your race is paused. Tap resume when ready.","RESUME ▶");
  }else if(paused){
    paused=false;running=true;
    $("overlay").classList.add("hidden");
    lastTime=performance.now();
    animationId=requestAnimationFrame(loop);
  }
}

function update(dt) {
  level=1+Math.floor(score/100);
  const boosting=keys.nitro&&fuel>0;
  const speed=230+level*15+(boosting?135:0);

  if(boosting) fuel=Math.max(0,fuel-32*dt);
  else fuel=Math.min(100,fuel+8*dt);

  if(keys.left) player.x-=250*dt;
  if(keys.right) player.x+=250*dt;
  player.x=Math.max(L+7,Math.min(R-player.w-7,player.x));

  roadOffset=(roadOffset+speed*dt)%130;
  sceneOffset=(sceneOffset+speed*.4*dt)%115;

  spawnTimer+=dt;
  if(spawnTimer>Math.max(.43,1.0-level*.065)){
    spawnEnemy();spawnTimer=0;
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.y+=speed*dt;
    if(collides(player,e)){
      enemies.splice(i,1);
      lives--;
      if(lives<=0){finishGame();return;}
      continue;
    }
    if(e.y>H){
      enemies.splice(i,1);
      score+=10;
    }
  }
  updateHUD();
}

function drawStatic() {
  drawRoad(0);
  enemies.forEach(e=>drawCar(e,false));
  if(player) drawCar(player,true);
}

function loop(time) {
  if(!running||paused)return;
  const dt=Math.min((time-lastTime)/1000||0,.035);
  lastTime=time;
  update(dt);
  if(!running){drawStatic();return;}
  drawRoad(0);
  enemies.forEach(e=>drawCar(e,false));
  drawCar(player,true);
  animationId=requestAnimationFrame(loop);
}

$("start").addEventListener("click",(event)=>{
  event.preventDefault();
  if(paused) {
    paused=false;running=true;
    $("overlay").classList.add("hidden");
    lastTime=performance.now();
    animationId=requestAnimationFrame(loop);
  } else {
    startGame();
  }
});
$("pause").addEventListener("click",(event)=>{
  event.preventDefault();
  togglePause();
});

function bindControl(id,key) {
  const button = $(id);
  button.style.touchAction = "none";

  const press = e => {
    if (e) e.preventDefault();
    keys[key] = true;
  };
  const release = e => {
    if (e) e.preventDefault();
    keys[key] = false;
  };

  // Use one input system at a time to avoid duplicate Android touch events.
  if ("PointerEvent" in window) {
    button.addEventListener("pointerdown", press, {passive:false});
    button.addEventListener("pointerup", release, {passive:false});
    button.addEventListener("pointercancel", release, {passive:false});
    button.addEventListener("lostpointercapture", release);
  } else {
    button.addEventListener("touchstart", press, {passive:false});
    button.addEventListener("touchend", release, {passive:false});
    button.addEventListener("touchcancel", release, {passive:false});
    button.addEventListener("mousedown", press);
    button.addEventListener("mouseup", release);
    button.addEventListener("mouseleave", release);
  }
}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a"){keys.left=true;e.preventDefault();}
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d"){keys.right=true;e.preventDefault();}
  if(e.key===" "){e.preventDefault();togglePause();}
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false;
});
window.addEventListener("blur",()=>{
  keys.left=keys.right=keys.nitro=false;
});

resetGame();
drawStatic();
</script>
</body>
</html>
